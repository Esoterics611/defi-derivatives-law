site_name: "The DeFi Derivatives Lawyer"
site_description: "CFTC Regulation, Swap Contracts & AI-Augmented Practice"
site_author: "Vanguard Academy"

theme:
  name: material
  palette:
    scheme: slate
    primary: cyan
    accent: amber
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - pymdownx.emoji
  - pymdownx.mark
  - pymdownx.critic

